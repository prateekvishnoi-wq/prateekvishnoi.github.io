<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1280" height="440" fill="#e9f0ee"/>
  <circle cx="1240" cy="-20" r="180" fill="#dbe8e5"/>
  <circle cx="60" cy="430" r="170" fill="#dbe8e5"/>

  <!-- Dice -->
  <g transform="translate(60 50)">
    <rect x="0" y="0" width="96" height="96" rx="16" fill="#fff" stroke="#172d32" stroke-width="3"/>
    <g fill="#172d32"><circle cx="26" cy="26" r="8"/><circle cx="70" cy="26" r="8"/><circle cx="48" cy="48" r="8"/><circle cx="26" cy="70" r="8"/><circle cx="70" cy="70" r="8"/></g>
    <g transform="translate(110 40) rotate(14)">
      <rect x="0" y="0" width="76" height="76" rx="13" fill="#175963"/>
      <g fill="#fff"><circle cx="20" cy="20" r="7"/><circle cx="56" cy="56" r="7"/><circle cx="56" cy="20" r="7"/><circle cx="20" cy="56" r="7"/></g>
    </g>
  </g>
  <!-- Coin flips -->
  <g transform="translate(60 210)" font-size="16" font-weight="700" text-anchor="middle">
    <circle cx="20" cy="20" r="19" fill="#f2cc8f" stroke="#815c22" stroke-width="2"/><text x="20" y="26" fill="#815c22">H</text>
    <circle cx="64" cy="20" r="19" fill="#fff" stroke="#815c22" stroke-width="2"/><text x="64" y="26" fill="#815c22">T</text>
    <circle cx="108" cy="20" r="19" fill="#f2cc8f" stroke="#815c22" stroke-width="2"/><text x="108" y="26" fill="#815c22">H</text>
    <circle cx="152" cy="20" r="19" fill="#f2cc8f" stroke="#815c22" stroke-width="2"/><text x="152" y="26" fill="#815c22">H</text>
    <circle cx="196" cy="20" r="19" fill="#fff" stroke="#815c22" stroke-width="2"/><text x="196" y="26" fill="#815c22">T</text>
    <text x="0" y="72" font-size="13" font-weight="400" fill="#475b60" font-style="italic" text-anchor="start">r ~ Uniform({0,1}ᵏ)</text>
  </g>

  <!-- Binomial distribution + Chernoff tail -->
  <g transform="translate(340 40)">
    <line x1="0" y1="220" x2="330" y2="220" stroke="#475b60" stroke-width="2"/>
    <g fill="#9fc3bd">
      <rect x="10" y="214" width="22" height="6"/><rect x="36" y="200" width="22" height="20"/><rect x="62" y="172" width="22" height="48"/>
      <rect x="88" y="126" width="22" height="94"/><rect x="114" y="74" width="22" height="146"/><rect x="140" y="38" width="22" height="182" fill="#175963"/>
      <rect x="166" y="38" width="22" height="182" fill="#175963"/><rect x="192" y="74" width="22" height="146"/><rect x="218" y="126" width="22" height="94"/>
    </g>
    <g fill="#e3a58f"><rect x="244" y="172" width="22" height="48"/><rect x="270" y="200" width="22" height="20"/><rect x="296" y="214" width="22" height="6"/></g>
    <line x1="164" y1="20" x2="164" y2="230" stroke="#172d32" stroke-dasharray="5 5" stroke-width="1.5"/>
    <text x="164" y="248" font-size="14" fill="#172d32" text-anchor="middle" font-style="italic">μ = E[X]</text>
    <text x="282" y="160" font-size="13" fill="#b5523b" text-anchor="middle">tail</text>
    <text x="0" y="284" font-size="15" font-weight="650" fill="#172d32">Concentration bounds</text>
    <text x="0" y="306" font-size="13" fill="#475b60" font-style="italic">Pr[X ≥ (1+δ)μ] ≤ e^(−δ²μ/3)</text>
  </g>

  <!-- Karger min-cut graph -->
  <g transform="translate(740 40)">
    <g stroke="#9fb9b4" stroke-width="2.5">
      <line x1="30" y1="40" x2="110" y2="20"/><line x1="30" y1="40" x2="60" y2="130"/><line x1="110" y1="20" x2="60" y2="130"/>
      <line x1="110" y1="20" x2="150" y2="110"/><line x1="60" y1="130" x2="150" y2="110"/><line x1="30" y1="40" x2="150" y2="110"/>
      <line x1="250" y1="30" x2="330" y2="60"/><line x1="250" y1="30" x2="280" y2="150"/><line x1="330" y1="60" x2="280" y2="150"/>
      <line x1="250" y1="30" x2="350" y2="170"/><line x1="280" y1="150" x2="350" y2="170"/><line x1="330" y1="60" x2="350" y2="170"/>
    </g>
    <g stroke="#b5523b" stroke-width="4" stroke-dasharray="8 6">
      <line x1="150" y1="110" x2="250" y2="30"/><line x1="60" y1="130" x2="280" y2="150"/>
    </g>
    <path d="M200 -4 L200 210" stroke="#b5523b" stroke-width="2" stroke-dasharray="3 6"/>
    <g stroke="#fff" stroke-width="3">
      <circle cx="30" cy="40" r="13" fill="#175963"/><circle cx="110" cy="20" r="13" fill="#175963"/><circle cx="60" cy="130" r="13" fill="#175963"/><circle cx="150" cy="110" r="13" fill="#175963"/>
      <circle cx="250" cy="30" r="13" fill="#5b8e95"/><circle cx="330" cy="60" r="13" fill="#5b8e95"/><circle cx="280" cy="150" r="13" fill="#5b8e95"/><circle cx="350" cy="170" r="13" fill="#5b8e95"/>
    </g>
    <text x="0" y="244" font-size="15" font-weight="650" fill="#172d32">Karger’s min-cut</text>
    <text x="0" y="266" font-size="13" fill="#475b60" font-style="italic">Pr[min cut survives] ≥ 2 / n(n−1)</text>
  </g>

  <!-- Algorithm chips -->
  <g font-size="15" font-weight="600" text-anchor="middle">
    <rect x="60" y="372" width="176" height="40" rx="20" fill="#175963"/><text x="148" y="397" fill="#fff">Las Vegas</text>
    <rect x="252" y="372" width="176" height="40" rx="20" fill="#fff" stroke="#175963" stroke-width="2"/><text x="340" y="397" fill="#175963">Monte Carlo</text>
    <rect x="444" y="372" width="176" height="40" rx="20" fill="#175963"/><text x="532" y="397" fill="#fff">Miller–Rabin</text>
    <rect x="636" y="372" width="176" height="40" rx="20" fill="#fff" stroke="#175963" stroke-width="2"/><text x="724" y="397" fill="#175963">Freivalds</text>
    <rect x="828" y="372" width="196" height="40" rx="20" fill="#175963"/><text x="926" y="397" fill="#fff">Randomized Quicksort</text>
    <rect x="1040" y="372" width="196" height="40" rx="20" fill="#fff" stroke="#175963" stroke-width="2"/><text x="1138" y="397" fill="#175963">Hashing &amp; Sketches</text>
  </g>
</svg>
