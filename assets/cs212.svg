<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475b60"/></marker>
  </defs>
  <rect width="1280" height="400" fill="#e9f0ee"/>
  <circle cx="1220" cy="-20" r="190" fill="#dbe8e5"/>
  <circle cx="40" cy="420" r="160" fill="#dbe8e5"/>

  <!-- Pseudocode card -->
  <g transform="translate(48 48)">
    <rect width="300" height="200" rx="10" fill="#172d32"/>
    <circle cx="20" cy="18" r="5" fill="#e07a5f"/><circle cx="36" cy="18" r="5" fill="#f2cc8f"/><circle cx="52" cy="18" r="5" fill="#81b29a"/>
    <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" fill="#e9f0ee">
      <text x="22" y="56"><tspan fill="#8ecae6">MergeSort</tspan>(A, l, r)</text>
      <text x="40" y="82"><tspan fill="#f2cc8f">if</tspan> l &lt; r:</text>
      <text x="58" y="108">m ← ⌊(l + r) / 2⌋</text>
      <text x="58" y="134">MergeSort(A, l, m)</text>
      <text x="58" y="160">MergeSort(A, m+1, r)</text>
      <text x="58" y="186">Merge(A, l, m, r)</text>
    </g>
  </g>
  <text x="48" y="282" font-size="15" fill="#475b60" font-style="italic">T(n) = 2T(n/2) + Θ(n) = Θ(n log n)</text>

  <!-- Graph with shortest path highlighted -->
  <g transform="translate(400 40)">
    <g stroke="#9fb9b4" stroke-width="2.5">
      <line x1="30" y1="60" x2="130" y2="20"/><line x1="30" y1="60" x2="110" y2="130"/>
      <line x1="130" y1="20" x2="240" y2="50"/><line x1="110" y1="130" x2="240" y2="50"/>
      <line x1="110" y1="130" x2="200" y2="190"/><line x1="240" y1="50" x2="300" y2="150"/>
      <line x1="200" y1="190" x2="300" y2="150"/><line x1="30" y1="60" x2="60" y2="190"/>
      <line x1="60" y1="190" x2="200" y2="190"/>
    </g>
    <g stroke="#175963" stroke-width="5" stroke-linecap="round">
      <line x1="30" y1="60" x2="110" y2="130"/><line x1="110" y1="130" x2="200" y2="190"/><line x1="200" y1="190" x2="300" y2="150"/>
    </g>
    <g font-size="13" fill="#475b60">
      <text x="72" y="34">4</text><text x="56" y="104">2</text><text x="184" y="28">3</text><text x="182" y="86">5</text>
      <text x="146" y="152">1</text><text x="276" y="94">7</text><text x="250" y="186">2</text><text x="30" y="132">6</text><text x="124" y="208">4</text>
    </g>
    <g stroke="#fff" stroke-width="3">
      <circle cx="30" cy="60" r="15" fill="#175963"/><circle cx="130" cy="20" r="13" fill="#5b8e95"/>
      <circle cx="110" cy="130" r="13" fill="#175963"/><circle cx="240" cy="50" r="13" fill="#5b8e95"/>
      <circle cx="200" cy="190" r="13" fill="#175963"/><circle cx="300" cy="150" r="15" fill="#175963"/>
      <circle cx="60" cy="190" r="13" fill="#5b8e95"/>
    </g>
    <text x="25" y="65" font-size="13" font-weight="700" fill="#fff">s</text>
    <text x="296" y="155" font-size="13" font-weight="700" fill="#fff">t</text>
    <text x="0" y="250" font-size="15" font-weight="650" fill="#172d32">Shortest paths</text>
    <text x="0" y="272" font-size="13" fill="#475b60">BFS · DFS · Dijkstra · MST</text>
  </g>

  <!-- DP table -->
  <g transform="translate(760 52)">
    <g font-size="13" fill="#475b60" text-anchor="middle">
      <text x="45" y="-8">0</text><text x="75" y="-8">1</text><text x="105" y="-8">2</text><text x="135" y="-8">3</text><text x="165" y="-8">4</text>
    </g>
    <g stroke="#cddbd8" stroke-width="1.5" fill="#fff">
      <rect x="30" y="0" width="30" height="30"/><rect x="60" y="0" width="30" height="30"/><rect x="90" y="0" width="30" height="30"/><rect x="120" y="0" width="30" height="30"/><rect x="150" y="0" width="30" height="30"/>
      <rect x="30" y="30" width="30" height="30"/><rect x="60" y="30" width="30" height="30"/><rect x="90" y="30" width="30" height="30"/><rect x="120" y="30" width="30" height="30"/><rect x="150" y="30" width="30" height="30"/>
      <rect x="30" y="60" width="30" height="30"/><rect x="60" y="60" width="30" height="30"/><rect x="90" y="60" width="30" height="30"/><rect x="120" y="60" width="30" height="30" fill="#cfe3df"/><rect x="150" y="60" width="30" height="30" fill="#cfe3df"/>
      <rect x="30" y="90" width="30" height="30"/><rect x="60" y="90" width="30" height="30"/><rect x="90" y="90" width="30" height="30"/><rect x="120" y="90" width="30" height="30" fill="#cfe3df"/><rect x="150" y="90" width="30" height="30" fill="#175963"/>
    </g>
    <g font-size="14" fill="#172d32" text-anchor="middle">
      <text x="45" y="20">0</text><text x="75" y="20">1</text><text x="105" y="20">2</text><text x="135" y="20">3</text><text x="165" y="20">4</text>
      <text x="45" y="50">1</text><text x="75" y="50">1</text><text x="105" y="50">2</text><text x="135" y="50">3</text><text x="165" y="50">4</text>
      <text x="45" y="80">2</text><text x="75" y="80">2</text><text x="105" y="80">1</text><text x="135" y="80">2</text><text x="165" y="80">3</text>
      <text x="45" y="110">3</text><text x="75" y="110">3</text><text x="105" y="110">2</text><text x="135" y="110">2</text><text x="165" y="110" fill="#fff" font-weight="700">2</text>
    </g>
    <text x="0" y="168" font-size="15" font-weight="650" fill="#172d32">Dynamic programming</text>
    <text x="0" y="190" font-size="13" fill="#475b60">dp[i][j] = min(dp[i−1][j] + 1, dp[i][j−1] + 1, …)</text>
  </g>

  <!-- Growth-rate chart -->
  <g transform="translate(1030 40)">
    <line x1="10" y1="220" x2="10" y2="0" stroke="#475b60" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="10" y1="220" x2="210" y2="220" stroke="#475b60" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M10 218 Q120 190 200 30" fill="none" stroke="#b5523b" stroke-width="3"/>
    <path d="M10 218 Q130 170 200 100" fill="none" stroke="#815c22" stroke-width="3"/>
    <path d="M10 218 L200 140" fill="none" stroke="#175963" stroke-width="3"/>
    <path d="M10 218 Q40 190 200 188" fill="none" stroke="#5b8e95" stroke-width="3"/>
    <g font-size="13" font-style="italic">
      <text x="150" y="22" fill="#b5523b">n²</text><text x="140" y="96" fill="#815c22">n log n</text>
      <text x="170" y="134" fill="#175963">n</text><text x="150" y="182" fill="#5b8e95">log n</text>
    </g>
    <text x="10" y="250" font-size="15" font-weight="650" fill="#172d32">Asymptotic analysis</text>
  </g>

  <!-- Technique chips -->
  <g font-size="15" font-weight="600" text-anchor="middle">
    <rect x="48" y="326" width="196" height="40" rx="20" fill="#175963"/><text x="146" y="351" fill="#fff">Divide &amp; Conquer</text>
    <rect x="260" y="326" width="130" height="40" rx="20" fill="#fff" stroke="#175963" stroke-width="2"/><text x="325" y="351" fill="#175963">Greedy</text>
    <rect x="406" y="326" width="230" height="40" rx="20" fill="#175963"/><text x="521" y="351" fill="#fff">Dynamic Programming</text>
    <rect x="652" y="326" width="160" height="40" rx="20" fill="#fff" stroke="#175963" stroke-width="2"/><text x="732" y="351" fill="#175963">Backtracking</text>
    <rect x="828" y="326" width="190" height="40" rx="20" fill="#175963"/><text x="923" y="351" fill="#fff">Graph Algorithms</text>
    <rect x="1034" y="326" width="196" height="40" rx="20" fill="#fff" stroke="#175963" stroke-width="2"/><text x="1132" y="351" fill="#175963">NP-completeness</text>
  </g>
</svg>
