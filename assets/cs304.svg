<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#172d32"/></marker>
  </defs>
  <rect width="1280" height="440" fill="#e9f0ee"/>
  <circle cx="1250" cy="410" r="200" fill="#dbe8e5"/>
  <circle cx="20" cy="-30" r="150" fill="#dbe8e5"/>

  <!-- DFA: binary strings divisible by 3 -->
  <g transform="translate(40 20)" font-size="16">
    <line x1="0" y1="110" x2="38" y2="110" stroke="#172d32" stroke-width="2.5" marker-end="url(#ar)"/>
    <g fill="none" stroke="#172d32" stroke-width="2.5">
      <path d="M78 92 Q135 40 192 92" marker-end="url(#ar)"/>
      <path d="M192 128 Q135 180 78 128" marker-end="url(#ar)"/>
      <path d="M232 92 Q289 40 346 92" marker-end="url(#ar)"/>
      <path d="M346 128 Q289 180 232 128" marker-end="url(#ar)"/>
      <path d="M50 88 C30 30 90 30 72 88" marker-end="url(#ar)"/>
      <path d="M358 88 C338 30 398 30 380 88" marker-end="url(#ar)"/>
    </g>
    <circle cx="60" cy="110" r="22" fill="#fff" stroke="#175963" stroke-width="3"/>
    <circle cx="60" cy="110" r="16" fill="none" stroke="#175963" stroke-width="2"/>
    <circle cx="212" cy="110" r="22" fill="#fff" stroke="#175963" stroke-width="3"/>
    <circle cx="368" cy="110" r="22" fill="#fff" stroke="#175963" stroke-width="3"/>
    <g font-style="italic" fill="#172d32" text-anchor="middle">
      <text x="60" y="116">q₀</text><text x="212" y="116">q₁</text><text x="368" y="116">q₂</text>
      <text x="61" y="30" fill="#815c22">0</text><text x="369" y="30" fill="#815c22">1</text>
      <text x="135" y="52" fill="#815c22">1</text><text x="135" y="178" fill="#815c22">1</text>
      <text x="289" y="52" fill="#815c22">0</text><text x="289" y="178" fill="#815c22">0</text>
    </g>
    <text x="0" y="230" font-size="15" font-weight="650" fill="#172d32">Finite automata</text>
    <text x="0" y="252" font-size="13" fill="#475b60">L = { w ∈ {0,1}* : w is a multiple of 3 in binary }</text>
  </g>

  <!-- CFG parse tree -->
  <g transform="translate(500 34)" font-size="16" font-style="italic" text-anchor="middle">
    <g stroke="#9fb9b4" stroke-width="2">
      <line x1="120" y1="12" x2="60" y2="62"/><line x1="120" y1="12" x2="120" y2="62"/><line x1="120" y1="12" x2="180" y2="62"/>
      <line x1="120" y1="72" x2="70" y2="122"/><line x1="120" y1="72" x2="120" y2="122"/><line x1="120" y1="72" x2="170" y2="122"/>
      <line x1="120" y1="132" x2="120" y2="182"/>
    </g>
    <g fill="#fff" stroke="#175963" stroke-width="2">
      <circle cx="120" cy="8" r="15"/><circle cx="120" cy="68" r="15"/><circle cx="120" cy="128" r="15"/>
    </g>
    <g fill="#172d32">
      <text x="120" y="14">S</text><text x="120" y="74">S</text><text x="120" y="134">S</text>
      <text x="60" y="74" fill="#815c22">a</text><text x="180" y="74" fill="#815c22">b</text>
      <text x="70" y="134" fill="#815c22">a</text><text x="170" y="134" fill="#815c22">b</text>
      <text x="120" y="196" fill="#815c22">ε</text>
    </g>
    <g font-style="normal" text-anchor="start">
      <text x="-10" y="236" font-size="15" font-weight="650" fill="#172d32">Context-free grammars</text>
      <text x="-10" y="258" font-size="13" fill="#475b60" font-style="italic">S → aSb | ε   generates  aⁿbⁿ</text>
    </g>
  </g>

  <!-- Chomsky hierarchy -->
  <g transform="translate(860 16)" font-size="13" text-anchor="middle">
    <ellipse cx="190" cy="125" rx="185" ry="118" fill="#dbe8e5" stroke="#5b8e95" stroke-width="2"/>
    <ellipse cx="190" cy="145" rx="140" ry="92" fill="#cfe3df" stroke="#5b8e95" stroke-width="2"/>
    <ellipse cx="190" cy="165" rx="96" ry="64" fill="#b9d6d0" stroke="#175963" stroke-width="2"/>
    <ellipse cx="190" cy="185" rx="54" ry="36" fill="#175963"/>
    <text x="190" y="30" fill="#172d32" font-weight="600">Recursively enumerable</text>
    <text x="190" y="72" fill="#172d32" font-weight="600">Decidable</text>
    <text x="190" y="120" fill="#172d32" font-weight="600">Context-free</text>
    <text x="190" y="190" fill="#fff" font-weight="700">Regular</text>
    <text x="5" y="268" font-size="15" font-weight="650" fill="#172d32" text-anchor="start">The Chomsky hierarchy</text>
  </g>

  <!-- Turing machine tape -->
  <g transform="translate(40 370)">
    <g stroke="#175963" stroke-width="2" fill="#fff">
      <rect x="0" y="0" width="46" height="46"/><rect x="46" y="0" width="46" height="46"/><rect x="92" y="0" width="46" height="46"/><rect x="138" y="0" width="46" height="46"/>
      <rect x="184" y="0" width="46" height="46" fill="#f2cc8f"/><rect x="230" y="0" width="46" height="46"/><rect x="276" y="0" width="46" height="46"/><rect x="322" y="0" width="46" height="46"/>
      <rect x="368" y="0" width="46" height="46"/><rect x="414" y="0" width="46" height="46"/><rect x="460" y="0" width="46" height="46"/><rect x="506" y="0" width="46" height="46"/>
    </g>
    <g font-size="20" fill="#172d32" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="23" y="30">⊔</text><text x="69" y="30">1</text><text x="115" y="30">0</text><text x="161" y="30">1</text>
      <text x="207" y="30" font-weight="700">1</text><text x="253" y="30">0</text><text x="299" y="30">0</text><text x="345" y="30">1</text>
      <text x="391" y="30">1</text><text x="437" y="30">⊔</text><text x="483" y="30">⊔</text><text x="529" y="30">…</text>
    </g>
    <path d="M207 -26 L207 -6" stroke="#815c22" stroke-width="3" marker-end="url(#ar)"/>
    <rect x="160" y="-58" width="94" height="30" rx="6" fill="#172d32"/>
    <text x="207" y="-37" font-size="14" fill="#fff" text-anchor="middle" font-weight="600">head · q₃</text>
    <text x="580" y="20" font-size="15" font-weight="650" fill="#172d32">Turing machines</text>
    <text x="580" y="42" font-size="13" fill="#475b60" font-style="italic">δ(q₃, 1) = (q₄, 0, R)</text>
  </g>

  <!-- Pumping lemma -->
  <g transform="translate(865 362)" font-size="14">
    <text x="0" y="0" font-size="15" font-weight="650" fill="#172d32">Pumping lemma</text>
    <text x="0" y="24" fill="#475b60" font-style="italic">w = xyz,  |xy| ≤ p,  |y| ≥ 1  ⇒  xyⁱz ∈ L  for all i ≥ 0</text>
  </g>
</svg>
